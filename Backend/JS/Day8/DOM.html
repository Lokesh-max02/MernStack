const electricityBill=(name,unit)=>{
    if(unit <=100&&unit>=0){
        console.log(name,+"","Amount  ",unit*2);
        
    }
    else if(unit >=101&&unit<=200){
       console.log(name,"Amount  ",unit*3);
       
    }
     else if(unit>=201){
       console.log(name,"Amount:  ",unit*5);
       
    }
}
electricityBill("Lokesh",280)

const ATM=(amount,withraw)=>{
    if(withraw>0 && withraw%500===0 && amount>=withraw){
       let accountt=amount-withraw
       console.log("Balance: ",accountt);
       console.log("Withraw successfully: ",withraw);
       
    }else{
        console.log("Insufficent Balance");
        
    }

}

const login=(pin)=>{
    let attempt=0
    let correctPin=1234
    for(let i=1 ;i<=3;i++){
        attempt++
        if(correctPin===pin){
            console.log("Login Successful");
            break;
        }else{
          
            console.log("incorrect");
            
        }
        pin=0
    }
    if(attempt===3&&pin!=correctPin){
        console.log("Account Blocked");
        
    }
}
login(1234)
